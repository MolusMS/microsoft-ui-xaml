parameters:
  runTestJobName: RunSwitcherDevTests25H2
  dependsOn: []
  buildPlatform: x86
  buildConfiguration: chk
  testOS: Win11-25H2
  testSuite: DevTestSuite
  rerunPassesRequiredToAvoidFailure: 5
  testPayloadArtifactName: SwitcherTestPayload
  poolImage: ge_current-vhdx_enterprise
  parallelJobs: 20
  jobTimeoutInMinutes: 210
  testTimeoutInMinutes: 180

jobs:
- job: ${{ parameters.runTestJobName }}
  displayName: Run normal ${{ parameters.testOS }} tests with System composition
  dependsOn: ${{ parameters.dependsOn }}
  condition: not(failed())
  pool:
    type: windows
    isCustom: true
    name: WinDevPool-Test
    demands: ImageOverride -equals ${{ parameters.poolImage }}
  timeoutInMinutes: ${{ parameters.jobTimeoutInMinutes }}
  strategy:
    parallel: ${{ parameters.parallelJobs }}

  variables:
    - group: WinUI-InternalFeed
    - name: useBuildOutputFromBuildId
      value: $(Build.BuildId)
    - name: buildPlatform
      value: ${{ parameters.buildPlatform }}
    - name: buildConfiguration
      value: ${{ parameters.buildConfiguration }}
    - name: buildFlavor
      value: '${{ parameters.buildPlatform }}${{ parameters.buildConfiguration }}'
    - name: testPayloadDir
      value: $(Build.SourcesDirectory)\TestPayload\$(buildFlavor)
    - name: testOS
      value: ${{ parameters.testOS }}
    - name: uploadRoot
      value: c:\uploadroot
    - name: uploadRootInner
      value: $(uploadRoot)\$(testOS)\$(buildFlavor)
    - name: switcherResultsDir
      value: $(Build.SourcesDirectory)\SwitcherTestResults
    - name: testRunTitlePrefix
      value: Switcher${{ parameters.testSuite }}$(testOS)$(buildFlavor)
    - name: testRunTitle
      value: '$(testRunTitlePrefix)$(System.JobPositionInPhase)'
    - name: workItemsProjDir
      value: $(Build.SourcesDirectory)\helixworkitems\${{ parameters.testSuite }}\$(buildFlavor)\$(testOS)
    - name: workItemsProjNameFilter
      value: RunTestsInHelix-*.proj
    - name: artifactStatus
      value: Succeeded
    - name: AZURE_PIPELINES_DEDUP_PARALLELISM
      value: 16
    - name: ob_outputDirectory
      value: $(uploadRoot)
    - name: ob_artifactBaseName
      value: 'RunSwitcherTests_${{ parameters.runTestJobName }}_$(System.JobPositionInPhase)_$(artifactStatus)'
    - name: ob_sdl_binskim_enabled
      value: false

  steps:
  - task: PowerShell@2
    displayName: Display OS version info
    inputs:
      targetType: inline
      script: |
        Get-Item -Path 'HKLM:\Software\Microsoft\Windows NT\CurrentVersion'

  - task: PowerShell@2
    displayName: Register switcher LAF token as secret
    inputs:
      targetType: inline
      script: |
        if ([string]::IsNullOrEmpty($env:SWITCHER_LAF_TOKEN)) {
          throw 'The composition switcher LAF token is unavailable.'
        }
        Write-Host "##vso[task.setsecret]$env:SWITCHER_LAF_TOKEN"
    env:
      SWITCHER_LAF_TOKEN: $(CompositionSwitcherLafToken)

  - template: WinUI-DownloadPipelineArtifacts-Steps.yml
    parameters:
      itemPattern: '**/@(helixworkitems|TestPayload)/**'
      targetPath: $(Build.ArtifactStagingDirectory)

  - task: PowerShell@2
    displayName: Copy test payload and work items
    inputs:
      targetType: inline
      script: |
        Copy-Item `
          -Path "$(Build.ArtifactStagingDirectory)\${{ parameters.testPayloadArtifactName }}_*\*" `
          -Destination "$(Build.SourcesDirectory)" `
          -Recurse `
          -Force
        New-Item -ItemType Directory -Path "$(switcherResultsDir)" -Force |
          Out-Null

  - task: PowerShell@2
    displayName: Create switcher launch requests
    inputs:
      targetType: filePath
      filePath: build\PipelineScripts\Set-SwitcherLaunchRequest.ps1
      arguments: >-
        -LaunchRequestDirectory "$(testPayloadDir)\Test\.winui-switcher"
        -NativeManifestPath "$(Build.SourcesDirectory)\dxaml\test\packages\appx\appxmanifest.native.current.xml"
        -ManagedManifestPath "$(Build.SourcesDirectory)\dxaml\test\packages\appx\appxmanifest.managed.current.xml"
        -AdditionalLaunchRequestDirectories
        "$(testPayloadDir)\Test\UnpackagedApps\MUXControlsTestApp\.winui-switcher",
        "$(testPayloadDir)\Test\UnpackagedApps\TabViewTearOutApp\.winui-switcher"
        -PackagedLaunchRequestManifestPath
        "$(Build.SourcesDirectory)\controls\test\IXMPTestApp\Package.appxmanifest"
        -RunId "$(Build.BuildId)"
    env:
      SWITCHER_LAF_TOKEN: $(CompositionSwitcherLafToken)

  - task: PowerShell@2
    displayName: Run normal per-OS test slice with System composition
    timeoutInMinutes: ${{ parameters.testTimeoutInMinutes }}
    inputs:
      targetType: filePath
      filePath: Helix\common\pipeline\RunTestPassSliceOnBuildAgent.ps1
      arguments: >-
        -WorkItemProjFileNameFilter $(workItemsProjNameFilter)
        -WorkItemProjDir $(workItemsProjDir)
        -TestPayloadDir $(testPayloadDir)
        -UploadRoot $(uploadRootInner)
        -JobPositionInPhase $(System.JobPositionInPhase)
        -TotalJobsInPhase $(System.TotalJobsInPhase)
        -RerunPassesRequiredToAvoidFailure ${{ parameters.rerunPassesRequiredToAvoidFailure }}
      errorActionPreference: stop
      workingDirectory: $(switcherResultsDir)
    env:
      SWITCHER_LAF_TOKEN: $(CompositionSwitcherLafToken)

  - task: PowerShell@2
    condition: always()
    displayName: Remove switcher launch requests
    inputs:
      targetType: inline
      script: |
        $removeArguments = @{
          TestDirectory = "$(testPayloadDir)\Test"
        }
        $packagedRequestDirectory =
          "$(SwitcherPackagedLaunchRequestDirectory)"
        if (-not [string]::IsNullOrWhiteSpace($packagedRequestDirectory) -and
            -not $packagedRequestDirectory.Contains('$(')) {
          $removeArguments.PackagedLaunchRequestDirectory =
            $packagedRequestDirectory
        }
        & "$(Build.SourcesDirectory)\build\PipelineScripts\Remove-SwitcherLaunchRequests.ps1" `
          @removeArguments
        foreach ($temporaryFile in @(
            (Join-Path "$(switcherResultsDir)" 'args.txt'),
            (Join-Path "$(switcherResultsDir)" 'temp-runworkitem.cmd'),
            (Join-Path "$(testPayloadDir)" 'run.cmd'))) {
          if (Test-Path -LiteralPath $temporaryFile -PathType Leaf) {
            Remove-Item -LiteralPath $temporaryFile -Force
          }
        }

  - task: PowerShell@2
    condition: always()
    displayName: Sanitize switcher test outputs
    inputs:
      targetType: filePath
      filePath: build\PipelineScripts\Clear-SwitcherSensitiveArtifacts.ps1
      arguments: >-
        -ArtifactRoot "$(uploadRoot)"
        -AdditionalArtifactPath "$(switcherResultsDir)"
    env:
      SWITCHER_LAF_TOKEN: $(CompositionSwitcherLafToken)

  - task: PublishTestResults@2
    condition: and(always(), eq(variables['SwitcherArtifactsSanitized'], 'true'))
    displayName: Publish normal per-OS Switcher results
    inputs:
      testResultsFormat: xUnit
      testResultsFiles: testResults-*.xml
      searchFolder: $(switcherResultsDir)
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: $(testRunTitle)
      buildPlatform: $(buildPlatform)
      buildConfiguration: $(buildConfiguration)

  - task: PowerShell@2
    condition: and(always(), eq(variables['SwitcherArtifactsSanitized'], 'true'))
    displayName: Update Switcher unreliable tests
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      targetType: filePath
      filePath: Helix\common\pipeline\UpdateUnreliableTests-Pipeline.ps1
      arguments: >-
        -RerunPassesRequiredToAvoidFailure ${{ parameters.rerunPassesRequiredToAvoidFailure }}
        -TestRunTitle $(testRunTitle)
        -SubResultsDirPath $(uploadRootInner)

  - task: PowerShell@2
    condition: always()
    displayName: Set switcher artifact status
    inputs:
      targetType: inline
      script: |
        $status = '$(Agent.JobStatus)'
        if ($status -eq 'SucceededWithIssues') {
          $status = 'Succeeded'
        }
        Write-Host "##vso[task.setvariable variable=artifactStatus]$status"

  - task: PowerShell@2
    condition: and(always(), eq(variables['SwitcherArtifactsSanitized'], 'true'))
    displayName: Check whether Switcher test-output artifact already exists
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      targetType: inline
      script: |
        $name = 'RunSwitcherTests_${{ parameters.runTestJobName }}_$(System.JobPositionInPhase)_$(artifactStatus)'
        $uri =
          "$env:SYSTEM_COLLECTIONURI$env:SYSTEM_TEAMPROJECT/_apis/build/builds/$env:BUILD_BUILDID/artifacts" +
          "?artifactName=$([Uri]::EscapeDataString($name))&api-version=7.1"
        $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
        $exists = $false
        try {
          $null = Invoke-RestMethod `
            -Uri $uri `
            -Headers $headers `
            -ErrorAction Stop
          $exists = $true
          Write-Host "Artifact '$name' was already published by an earlier job attempt."
        } catch {
          Write-Host "Artifact '$name' is not present; this attempt will publish it."
        }
        Write-Host "##vso[task.setvariable variable=skipPublish]$exists"

  - task: PublishPipelineArtifact@1
    condition: and(always(), eq(variables['SwitcherArtifactsSanitized'], 'true'), ne(variables['skipPublish'], 'true'))
    displayName: Publish sanitized Switcher test output
    inputs:
      targetPath: $(uploadRoot)
      artifact: 'RunSwitcherTests_${{ parameters.runTestJobName }}_$(System.JobPositionInPhase)_$(artifactStatus)'
      parallel: true

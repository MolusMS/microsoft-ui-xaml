#
# Re-runs the native external DevTestSuite projects from Run Tests Stage with
# the lifted system-composition switcher enabled on the ge_current lab image.

stages:
- stage: RunSwitcherTests
  displayName: Run Switcher Tests (ge_release)
  dependsOn: Build
  condition: not(failed())
  variables:
  - group: WinUI-InternalFeed
  jobs:
  - template: WinUI-CreateTestPayload-Job.yml
    parameters:
      runTestJobName: CreateSwitcherTestPayload
      pipelineKind: Switcher
      testSuite: DevTestSuite
      testPayloadArtifactName: SwitcherTestPayload
      switcherMode: true
      taefExtraParameters: '/p:SwitcherLafToken=__SWITCHER_LAF_TOKEN__'

  - template: WinUI-RunTestPassOnPipeline-Job.yml
    parameters:
      runTestStageName: RunSwitcherTests
      runTestJobName: RunSwitcherTestsGeRelease
      dependsOn: CreateSwitcherTestPayload
      testOS: Win11-25H2
      testSuite: DevTestSuite
      testPayloadArtifactName: SwitcherTestPayload
      imageOverride: ge_current-vhdx_enterprise
      switcherMode: true
      failOnTestFailure: true

#
# Runs Composition Switcher validation in a dedicated pipeline stage.

parameters:
  - name: taefQuery
    type: string
    default: >-
      (@Name='*SwitcherTests*' OR
      @Name='*CompNode1WUCFull' OR
      @Name='*CompNode2WUCFull' OR
      @Name='*CompNode3WUCFull' OR
      @Name='*CompNode4WUCFull' OR
      @Name='*CompNode5WUCFull' OR
      @Name='*CompNode6WUCFull' OR
      @Name='*CompNode7WUCFull' OR
      @Name='*CompNode8WUCFull' OR
      @Name='*CompNode9WUCFull' OR
      @Name='*CompNode10WUCFull' OR
      @Name='*CompNode11WUCFull' OR
      @Name='*CompNode12WUCFull' OR
      @Name='*CompNode13WUCFull' OR
      @Name='*VerifyWpfSwitcherSystemCompositionPath' OR
      @Name='*VerifyMuxControlsInteractionSwitcherSystemCompositionPath' OR
      @Name='*VerifyMuxControlsApiSwitcherSystemCompositionPath' OR
      @Name='*VerifyIxmpSwitcherSystemCompositionPath')
  - name: expectedTestCount
    type: number
    default: 15
  - name: winUIDetailsPrBuildId
    type: string
    default: ''
  - name: expectedMockDCompSha256
    type: string
    default: '18D7D8B72264D5CF43966F559169DBD297333C1724ED049F4589ABB3244C06BF'

stages:
- stage: RunSwitcherTests
  displayName: Run Switcher Tests (ge_current)
  dependsOn: Build
  condition: not(failed())
  jobs:
  - template: WinUI-CreateTestPayload-Job.yml
    parameters:
      runTestJobName: CreateSwitcherTestPayload_x86chk
      pipelineKind: QuickPR
      testSuite: DevTestSuite
      testPayloadArtifactName: SwitcherTestPayload
      includeWinUIGallery: false
      taefQuery: "${{ parameters.taefQuery }}"
      taefExtraParameters: '/p:SwitcherMode=true /reportLoadingIssue'
      runIgnoredTests: 1
      postPayloadCreationSteps:
      - template: WinUI-OverlayWinUIDetailsMockDComp-Steps.yml
        parameters:
          winUIDetailsPrBuildId: ${{ parameters.winUIDetailsPrBuildId }}
          expectedMockDCompSha256: ${{ parameters.expectedMockDCompSha256 }}
          destinationPath: '$(testBinaryPath)\Test\MockDComp.dll'
      - task: powershell@2
        displayName: Prepare machine for test discovery
        inputs:
          targetType: filePath
          filePath: $(testBinaryPath)\RunSetupIfNeeded.ps1
          workingDirectory: $(testBinaryPath)
          errorActionPreference: continue
          ignoreLASTEXITCODE: true
        env:
          HELIX_CORRELATION_PAYLOAD: $(testBinaryPath)

  - template: WinUI-RunTestPassOnPipeline-Job.yml
    parameters:
      runTestStageName: RunSwitcherTests
      runTestJobName: RunSwitcherTests_x86chk
      dependsOn: CreateSwitcherTestPayload_x86chk
      buildPlatform: x86
      buildConfiguration: chk
      testOS: Win11-25H2
      testSuite: DevTestSuite
      rerunPassesRequiredToAvoidFailure: 1
      testPayloadArtifactName: SwitcherTestPayload
      failOnTestFailure: false
      agentPoolName: WinDevPool-Test
      imageOverride: ge_current-vhdx_enterprise
      parallelJobs: 1
      workItemsProjNameFilter: RunTestsInHelix-MUXCoreTests.proj
      jobTimeoutInMinutes: 180
      testTimeoutInMinutes: 120
      preTestSteps:
      - task: PowerShell@2
        displayName: Run private test pre-execution setup
        inputs:
          targetType: filePath
          filePath: build\PipelineScripts\Invoke-MockDCompPrivateTestApi.ps1
          arguments: >-
            -EntryPoint TestPreExecutionSetup
            -MockDCompPath "$(testPayloadDir)\Test\MockDComp.dll"
            -Platform $(buildPlatform)
      postTestSteps:
      - task: PowerShell@2
        condition: always()
        displayName: Run private test post-execution cleanup
        inputs:
          targetType: filePath
          filePath: build\PipelineScripts\Invoke-MockDCompPrivateTestApi.ps1
          arguments: >-
            -EntryPoint TestPostExecutionCleanup
            -MockDCompPath "$(testPayloadDir)\Test\MockDComp.dll"
            -Platform $(buildPlatform)

      - task: PowerShell@2
        condition: always()
        displayName: Remove temporary switcher runner files
        inputs:
          targetType: inline
          script: |
            foreach ($temporaryFile in @(
                (Join-Path "$(Build.SourcesDirectory)\build\PipelineScripts" 'args.txt'),
                (Join-Path "$(Build.SourcesDirectory)\build\PipelineScripts" 'temp-runworkitem.cmd'),
                (Join-Path "$(testPayloadDir)" 'run.cmd'))) {
              if (Test-Path -LiteralPath $temporaryFile -PathType Leaf) {
                Remove-Item -LiteralPath $temporaryFile -Force
              }
            }

      - task: powershell@2
        condition: always()
        displayName: Verify switcher certification results
        inputs:
          targetType: inline
          workingDirectory: $(Build.SourcesDirectory)\build\PipelineScripts
          script: |
            $resultPaths = @(
              Get-ChildItem -Path (Get-Location) -Filter 'testResults-*.xml' -File
            )
            if ($resultPaths.Count -eq 0) {
              throw 'No switcher xUnit results were produced.'
            }

            $total = 0
            $passed = 0
            $failed = 0
            $skipped = 0
            $errors = 0
            $testCases = @(
              foreach ($resultPath in $resultPaths) {
                [xml]$result = Get-Content -LiteralPath $resultPath.FullName
                foreach ($assembly in @($result.assemblies.assembly)) {
                  $total += [int]$assembly.total
                  $passed += [int]$assembly.passed
                  $failed += [int]$assembly.failed
                  $skipped += [int]$assembly.skipped
                  $errors += [int]$assembly.errors
                }
                $result.SelectNodes('/assemblies/assembly/collection/test')
              }
            )

            $expectedMethods = @(
              1..13 | ForEach-Object { "CompNode${_}WUCFull" }
            ) + @(
              'VerifyLiftedSystemCompositionPath'
              'VerifyManagedPackagedHostSystemCompositionPath'
            )
            $expectedTestCount = ${{ parameters.expectedTestCount }}
            $expectedPassedCount = $expectedTestCount - 1
            $knownFailureMethod = 'CompNode12WUCFull'
            $actualMethods = @($testCases | ForEach-Object { [string]$_.method })
            $missingMethods = @($expectedMethods | Where-Object { $actualMethods -notcontains $_ })
            $unexpectedMethods = @($actualMethods | Where-Object { $expectedMethods -notcontains $_ })
            $duplicateMethods = @(
              $actualMethods |
                Group-Object |
                Where-Object Count -ne 1 |
                ForEach-Object Name
            )

            Write-Host "Switcher xUnit summary: Total=$total Passed=$passed Failed=$failed Skipped=$skipped Errors=$errors"
            if ($expectedMethods.Count -ne $expectedTestCount) {
              throw "Switcher verifier configuration contains $($expectedMethods.Count) methods, but expectedTestCount is $expectedTestCount."
            }
            if ($testCases.Count -ne $total -or
                $missingMethods.Count -ne 0 -or
                $unexpectedMethods.Count -ne 0 -or
                $duplicateMethods.Count -ne 0) {
              throw "Switcher certification test shape mismatch. Missing=[$($missingMethods -join ', ')] Unexpected=[$($unexpectedMethods -join ', ')] Duplicates=[$($duplicateMethods -join ', ')]."
            }
            if ($total -ne $expectedTestCount -or
                $passed -ne $expectedPassedCount -or
                $failed -ne 1 -or
                $skipped -ne 0 -or
                $errors -ne 0) {
              throw "Switcher certification requires exactly $expectedPassedCount passes, the known CompNode12 failure, and no skipped tests or errors."
            }

            $failedTests = @($testCases | Where-Object { $_.result -eq 'Fail' })
            if ($failedTests.Count -ne 1 -or
                [string]$failedTests[0].method -ne $knownFailureMethod) {
              $failedMethods = @($failedTests | ForEach-Object { [string]$_.method })
              throw "Only $knownFailureMethod may fail; observed failures=[$($failedMethods -join ', ')]."
            }

            foreach ($certificationMethod in @(
                'VerifyLiftedSystemCompositionPath',
                'VerifyManagedPackagedHostSystemCompositionPath')) {
              $certificationTest = @(
                $testCases |
                  Where-Object { [string]$_.method -eq $certificationMethod }
              )
              if ($certificationTest.Count -ne 1 -or
                  [string]$certificationTest[0].result -ne 'Pass') {
                throw "Required System certification test $certificationMethod did not pass exactly once."
              }
            }

      # Add generated trees and images to the standard job artifact for baseline analysis.
      # A missing XamlTAEFOutput folder is valid when the test produced no trees.
      - task: PowerShell@2
        condition: always()
        displayName: Collect generated trees for baselining
        inputs:
          targetType: 'inline'
          script: |
            $dest = "$(ob_outputDirectory)\SwitcherBaselining"
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            $src = Join-Path $env:USERPROFILE 'Pictures\XamlTAEFOutput'
            if (Test-Path $src) {
              robocopy $src $dest *.save.xml *.out.xml *.png *.jpg /S /NFL /NDL /NJH /NJS | Out-Null
              if ($LASTEXITCODE -lt 8) { $global:LASTEXITCODE = 0 }
              Write-Host "Collected switcher baseline output from $src"
            } else {
              Write-Host "No XamlTAEFOutput folder at $src - nothing to collect (test produced no trees)."
            }

  - template: WinUI-RunTestPassOnPipeline-Job.yml
    parameters:
      runTestStageName: RunSwitcherTests
      runTestJobName: RunSwitcherHostCertification_x86chk
      dependsOn: CreateSwitcherTestPayload_x86chk
      buildPlatform: x86
      buildConfiguration: chk
      testOS: Win11-25H2
      testSuite: DevTestSuite
      rerunPassesRequiredToAvoidFailure: 1
      testPayloadArtifactName: SwitcherTestPayload
      failOnTestFailure: true
      agentPoolName: WinDevPool-Test
      imageOverride: ge_current-vhdx_enterprise
      parallelJobs: 1
      workItemsProjNameFilter: 'RunTestsInHelix-MUXCoreManagedTests-WPF.proj;RunTestsInHelix-MUXControlsInteractionTests.proj;RunTestsInHelix-MUXControlsApiTests.proj;RunTestsInHelix-IXMPTests.proj'
      jobTimeoutInMinutes: 150
      testTimeoutInMinutes: 120
      preTestSteps:
      - task: PowerShell@2
        displayName: Run private test pre-execution setup
        inputs:
          targetType: filePath
          filePath: build\PipelineScripts\Invoke-MockDCompPrivateTestApi.ps1
          arguments: >-
            -EntryPoint TestPreExecutionSetup
            -MockDCompPath "$(testPayloadDir)\Test\MockDComp.dll"
            -Platform $(buildPlatform)
      postTestSteps:
      - task: PowerShell@2
        condition: always()
        displayName: Run private test post-execution cleanup
        inputs:
          targetType: filePath
          filePath: build\PipelineScripts\Invoke-MockDCompPrivateTestApi.ps1
          arguments: >-
            -EntryPoint TestPostExecutionCleanup
            -MockDCompPath "$(testPayloadDir)\Test\MockDComp.dll"
            -Platform $(buildPlatform)

      - task: PowerShell@2
        condition: always()
        displayName: Verify standard host certification results
        inputs:
          targetType: inline
          workingDirectory: $(Build.SourcesDirectory)\build\PipelineScripts
          script: |
            $expectedMethods = @(
              'VerifyWpfSwitcherSystemCompositionPath'
              'VerifyMuxControlsInteractionSwitcherSystemCompositionPath'
              'VerifyMuxControlsApiSwitcherSystemCompositionPath'
              'VerifyIxmpSwitcherSystemCompositionPath'
            )
            $resultPaths = @(
              Get-ChildItem -Path (Get-Location) -Filter 'testResults-*.xml' -File
            )
            if ($resultPaths.Count -eq 0) {
              throw 'No host certification xUnit results were produced.'
            }

            $testCases = @(
              foreach ($resultPath in $resultPaths) {
                [xml]$result = Get-Content -LiteralPath $resultPath.FullName
                $result.SelectNodes('/assemblies/assembly/collection/test')
              }
            )
            $actualMethods = @($testCases | ForEach-Object { [string]$_.method })
            $missingMethods = @(
              $expectedMethods | Where-Object { $actualMethods -notcontains $_ }
            )
            $unexpectedMethods = @(
              $actualMethods | Where-Object { $expectedMethods -notcontains $_ }
            )
            $duplicateMethods = @(
              $actualMethods |
                Group-Object |
                Where-Object Count -ne 1 |
                ForEach-Object Name
            )
            $nonPassingMethods = @(
              $testCases |
                Where-Object { [string]$_.result -ne 'Pass' } |
                ForEach-Object { [string]$_.method }
            )

            if ($testCases.Count -ne $expectedMethods.Count -or
                $missingMethods.Count -ne 0 -or
                $unexpectedMethods.Count -ne 0 -or
                $duplicateMethods.Count -ne 0 -or
                $nonPassingMethods.Count -ne 0) {
              throw (
                'Switcher host certification result mismatch. ' +
                "Missing=[$($missingMethods -join ', ')] " +
                "Unexpected=[$($unexpectedMethods -join ', ')] " +
                "Duplicates=[$($duplicateMethods -join ', ')] " +
                "NonPassing=[$($nonPassingMethods -join ', ')].")
            }

            Write-Host (
              'Certified WPF, MUXControls interaction, MUXControls API, and ' +
              'IXMP System-composition paths through standard xUnit results.')

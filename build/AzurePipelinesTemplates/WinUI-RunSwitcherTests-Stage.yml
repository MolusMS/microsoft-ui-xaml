#
# Runs the composition switcher tests on a ge_current lab VM, using the masked LAF token to
# engage the switcher in the packaged host before XAML is initialized.
# Self-contained (modeled on WinUI-PGO-Train-Stage.yml, which uses the same ge_current pool) so
# it does not touch the shared per-OS RunTests matrix.
#
# This stage runs the SwitcherTests engagement certifiers, then independently probes the
# master-backed UAP and WPF suites. Each broad probe must certify System composition before
# functional failures are treated as non-gating.
parameters:
  - name: testSelector
    type: string
    default: '*SwitcherTests*'
  - name: expectedTestCount
    type: number
    default: 15

stages:
- stage: RunSwitcherTests
  displayName: Run Switcher Tests (ge_current)
  dependsOn: Build
  condition: not(failed())
  jobs:
  - job: RunSwitcherTests_x86chk
    pool:
      type: windows
      isCustom: true
      name: WinDevPool-Test
      demands: ImageOverride -equals ge_current-vhdx_enterprise
    timeoutInMinutes: 180
    variables:
      # This authorized variable group carries CompositionSwitcherLafToken; only the variable
      # name is public, while the value remains in Azure Pipelines Library.
      - group: WinUI-InternalFeed
      - name: buildPlatform
        value: 'x86'
      - name: normalizedConfiguration
        value: 'chk'
      - name: buildFolderName
        value: x86chk
      - name: incomingArtifactsPath
        value: $(Build.ArtifactStagingDirectory)\incoming
      - name: testPayloadDir
        value: $(Build.SourcesDirectory)\TestPayload
      - name: testPayloadDirInner
        value: $(testPayloadDir)\x86chk
      - name: helixWorkItemsDir
        value: $(Build.SourcesDirectory)\helixworkitems
      - name: switcherResultsDir
        value: $(Build.SourcesDirectory)\build\PipelineScripts
      - name: switcherResultsFile
        value: testResults-Foundation-Graphics-SwitcherTests.xml
      - name: isValidateWindowsAppSDKRun
        value: 0
      - name: ob_outputDirectory
        value: c:\uploadroot
      - name: ob_artifactBaseName
        value: 'switcher_x86chk'
      - name: ob_sdl_binskim_enabled
        value: false

    steps:
    - script: |
        reg query "HKLM\Software\Microsoft\Windows NT\CurrentVersion"
      displayName: Display OS version info

    - task: PowerShell@2
      displayName: Register switcher LAF token as secret
      inputs:
        targetType: inline
        script: |
          if ([string]::IsNullOrEmpty($env:SWITCHER_LAF_TOKEN)) {
            throw 'The composition switcher LAF token is unavailable.'
          }
          Write-Host "##vso[task.setsecret]$env:SWITCHER_LAF_TOKEN"
      env:
        SWITCHER_LAF_TOKEN: $(CompositionSwitcherLafToken)

    - task: NuGetAuthenticate@1

    - task: NuGetCommand@2
      displayName: 'NuGet restore Lifted XAML dependencies'
      inputs:
        command: 'custom'
        arguments: 'restore packages.config -ConfigFile nuget.config -PackagesDirectory $(Build.SourcesDirectory)\packages'
        includeNuGetOrg: false

    - template: WinUI-DownloadPipelineArtifacts-Steps.yml
      parameters:
        enableUseOutputFromPreviousBuild: true
        itemPattern: '**/?(x86chk|GenXBF|Taef)/**'
        targetPath: $(incomingArtifactsPath)

    # The build publishes each flavor as a 'drop_*' artifact whose contents are rooted under a
    # 'drop\' folder (e.g. drop\x86chk\TAEF, drop\GenXBF\x86). Merge the downloaded drop_* folders
    # up into $(incomingArtifactsPath) so the payload lives at $(incomingArtifactsPath)\drop, matching
    # what CreateTestPayload.ps1 -BinSourceRoot expects (mirrors WinUI-CreateTestPayload-Job.yml).
    - task: PowerShell@2
      displayName: Merge downloaded drops to parent
      inputs:
        targetType: 'inline'
        script: |
          Copy-Item -Path "$(incomingArtifactsPath)\drop_*\*" -Destination "$(incomingArtifactsPath)" -Recurse -Force

    - task: powershell@2
      displayName: Prepare test payload
      inputs:
        targetType: filePath
        filePath: test\CreateTestPayload.ps1
        arguments: -BinSourceRoot $(incomingArtifactsPath)\drop -Platform x86 -Configuration chk -Mode DevTestSuite -ShowPayload -SkipSymbols

    # Work-item generation runs TAEF discovery, so the UAP dependencies must be installed before
    # generation. RunHelixWorkItem.ps1 calls this again, but the payload marker makes that a no-op.
    - task: powershell@2
      displayName: Prepare machine for test discovery
      inputs:
        targetType: filePath
        filePath: $(testPayloadDirInner)\RunSetupIfNeeded.ps1
        workingDirectory: $(testPayloadDirInner)
        errorActionPreference: continue
        ignoreLASTEXITCODE: true
      env:
        HELIX_CORRELATION_PAYLOAD: $(testPayloadDirInner)

    # Use the same generated-work-item path as the regular DevTestSuite. The tests declare
    # RunAs=UAP but no Hosting:Mode metadata, so HostingMode is passed as a runtime parameter
    # rather than added to the TAEF selection query. The launch request makes the packaged host
    # select System before Application::Start; ClassSetup reauthorizes the token and the tests
    # certify the committed backend. The token placeholder remains unexpanded in the work item and is
    # expanded only by cmd.exe on the execution machine after Azure Pipelines masks the value.
    - template: WinUI-CreateHelixProjFile-Steps.yml
      parameters:
        testFilePathPattern: 'Test\Microsoft.UI.Xaml.Tests.External.Foundation.dll'
        testBinaryPath: $(testPayloadDirInner)
        outputProjFileName: 'RunTestsInHelix-SwitcherTests.proj'
        testSuite: DevTestSuite
        taefQuery: "(@Name='${{ parameters.testSelector }}')"
        taefExtraParameters: '/p:HostingMode=UAP /p:SwitcherLafToken=%SWITCHER_LAF_TOKEN% /reportLoadingIssue'
        # The packaged entry point engages the switcher before ClassSetup. Do not also
        # pass SwitcherMode=true: ModuleSetup runs in an elevated unpackaged fixture process where
        # the AppX CompositionEngine registration is intentionally unavailable.
        switcherMode: 0
        targetOsVersion: '26200'
        taefExePath: $(testPayloadDirInner)\te.exe

    - task: powershell@2
      displayName: Create packaged switcher launch request
      inputs:
        targetType: filePath
        filePath: build\PipelineScripts\Set-SwitcherLaunchRequest.ps1
        arguments: >-
          -LaunchRequestDirectory "$(testPayloadDirInner)\Test\.winui-switcher"
          -NativeManifestPath "$(Build.SourcesDirectory)\dxaml\test\packages\appx\appxmanifest.native.current.xml"
          -ManagedManifestPath "$(Build.SourcesDirectory)\dxaml\test\packages\appx\appxmanifest.managed.current.xml"
      env:
        SWITCHER_LAF_TOKEN: $(CompositionSwitcherLafToken)

    - task: powershell@2
      displayName: Run Switcher Tests
      timeoutInMinutes: 120
      inputs:
        targetType: filePath
        filePath: Helix\common\pipeline\RunTestPassSliceOnBuildAgent.ps1
        arguments: -WorkItemProjFileNameFilter RunTestsInHelix-SwitcherTests.proj -WorkItemProjDir $(helixWorkItemsDir) -TestPayloadDir $(testPayloadDirInner) -UploadRoot $(ob_outputDirectory) -JobPositionInPhase 1 -TotalJobsInPhase 1 -RerunPassesRequiredToAvoidFailure 1
        errorActionPreference: stop
        workingDirectory: $(switcherResultsDir)
      env:
        SWITCHER_LAF_TOKEN: $(CompositionSwitcherLafToken)

    - task: PowerShell@2
      condition: always()
      displayName: Remove packaged switcher launch request
      inputs:
        targetType: inline
        script: |
          $launchRequestDirectory =
            Join-Path "$(testPayloadDirInner)" 'Test\.winui-switcher'
          if (Test-Path -LiteralPath $launchRequestDirectory) {
            Remove-Item -LiteralPath $launchRequestDirectory -Recurse -Force
          }
          foreach ($temporaryFile in @(
              (Join-Path "$(switcherResultsDir)" 'args.txt'),
              (Join-Path "$(switcherResultsDir)" 'temp-runworkitem.cmd'),
              (Join-Path "$(testPayloadDirInner)" 'run.cmd'))) {
            if (Test-Path -LiteralPath $temporaryFile -PathType Leaf) {
              Remove-Item -LiteralPath $temporaryFile -Force
            }
          }

    - task: PowerShell@2
      condition: always()
      displayName: Sanitize switcher diagnostic artifacts
      inputs:
        targetType: filePath
        filePath: build\PipelineScripts\Clear-SwitcherSensitiveArtifacts.ps1
        arguments: >-
          -ArtifactRoot "$(ob_outputDirectory)"
          -AdditionalArtifactPath "$(switcherResultsDir)\$(switcherResultsFile)"
      env:
        SWITCHER_LAF_TOKEN: $(CompositionSwitcherLafToken)

    - task: powershell@2
      condition: always()
      displayName: Verify switcher certification results
      inputs:
        targetType: inline
        workingDirectory: $(switcherResultsDir)
        script: |
          $resultPath = Join-Path (Get-Location) '$(switcherResultsFile)'
          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "No switcher xUnit results were produced at $resultPath."
          }

          $total = 0
          $passed = 0
          $failed = 0
          $skipped = 0
          $errors = 0
          [xml]$result = Get-Content -LiteralPath $resultPath
          foreach ($assembly in @($result.assemblies.assembly)) {
            $total += [int]$assembly.total
            $passed += [int]$assembly.passed
            $failed += [int]$assembly.failed
            $skipped += [int]$assembly.skipped
            $errors += [int]$assembly.errors
          }

          $expectedMethods = @(
            1..13 | ForEach-Object { "CompNode${_}WUCFullSwitcherWithMockDComp" }
          ) + @(
            'VerifyLiftedSystemCompositionPath',
            'VerifyManagedPackagedHostSystemCompositionPath'
          )
          $expectedTestCount = ${{ parameters.expectedTestCount }}
          $expectedPassedCount = $expectedTestCount - 1
          $knownFailureMethod = 'CompNode12WUCFullSwitcherWithMockDComp'
          $testCases = @($result.SelectNodes('/assemblies/assembly/collection/test'))
          $actualMethods = @($testCases | ForEach-Object { [string]$_.method })
          $missingMethods = @($expectedMethods | Where-Object { $actualMethods -notcontains $_ })
          $unexpectedMethods = @($actualMethods | Where-Object { $expectedMethods -notcontains $_ })
          $duplicateMethods = @(
            $actualMethods |
              Group-Object |
              Where-Object Count -ne 1 |
              ForEach-Object Name
          )

          Write-Host "Switcher xUnit summary: Total=$total Passed=$passed Failed=$failed Skipped=$skipped Errors=$errors"
          if ($expectedMethods.Count -ne $expectedTestCount) {
            throw "Switcher verifier configuration contains $($expectedMethods.Count) methods, but expectedTestCount is $expectedTestCount."
          }
          if ($testCases.Count -ne $total -or
              $missingMethods.Count -ne 0 -or
              $unexpectedMethods.Count -ne 0 -or
              $duplicateMethods.Count -ne 0) {
            throw "Switcher certification test shape mismatch. Missing=[$($missingMethods -join ', ')] Unexpected=[$($unexpectedMethods -join ', ')] Duplicates=[$($duplicateMethods -join ', ')]."
          }
          if ($total -ne $expectedTestCount -or
              $passed -ne $expectedPassedCount -or
              $failed -ne 1 -or
              $skipped -ne 0 -or
              $errors -ne 0) {
            throw "Switcher certification requires exactly $expectedPassedCount passes, the known CompNode12 failure, and no skipped tests or errors."
          }

          $failedTests = @($testCases | Where-Object { $_.result -eq 'Fail' })
          if ($failedTests.Count -ne 1 -or
              [string]$failedTests[0].method -ne $knownFailureMethod) {
            $failedMethods = @($failedTests | ForEach-Object { [string]$_.method })
            throw "Only $knownFailureMethod may fail; observed failures=[$($failedMethods -join ', ')]."
          }

          foreach ($certificationMethod in @(
              'VerifyLiftedSystemCompositionPath',
              'VerifyManagedPackagedHostSystemCompositionPath')) {
            $certificationTest = @(
              $testCases |
                Where-Object { [string]$_.method -eq $certificationMethod }
            )
            if ($certificationTest.Count -ne 1 -or
                [string]$certificationTest[0].result -ne 'Pass') {
              throw "Required System certification test $certificationMethod did not pass exactly once."
            }
          }

    - task: PublishTestResults@2
      condition: and(always(), eq(variables['SwitcherArtifactsSanitized'], 'true'))
      inputs:
        testResultsFormat: xUnit
        testResultsFiles: $(switcherResultsFile)
        searchFolder: $(switcherResultsDir)
        mergeTestResults: true
        # The preceding verifier permits only the single known CompNode12 failure.
        failTaskOnFailedTests: false
        testRunTitle: 'SwitcherTests x86chk'

    # Publish the generated .save.xml trees + diffs/screenshots so switcher baselines can be
    # captured from this run (they are intentionally NOT committed; see PR description).
    # Resilient: ensure the output dir exists and only copy when the test actually produced output,
    # so a missing XamlTAEFOutput folder (e.g. no trees generated) doesn't error the stage.
    - task: PowerShell@2
      condition: always()
      displayName: Collect generated trees for baselining
      inputs:
        targetType: 'inline'
        script: |
          $dest = "$(ob_outputDirectory)\SwitcherBaselining"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $src = Join-Path $env:USERPROFILE 'Pictures\XamlTAEFOutput'
          if (Test-Path $src) {
            robocopy $src $dest *.save.xml *.out.xml *.png *.jpg /S /NFL /NDL /NJH /NJS | Out-Null
            if ($LASTEXITCODE -lt 8) { $global:LASTEXITCODE = 0 }
            Write-Host "Collected switcher baseline output from $src"
          } else {
            Write-Host "No XamlTAEFOutput folder at $src - nothing to collect (test produced no trees)."
          }

    - task: PowerShell@2
      condition: always()
      displayName: Sanitize collected switcher baselines
      inputs:
        targetType: filePath
        filePath: build\PipelineScripts\Clear-SwitcherSensitiveArtifacts.ps1
        arguments: -ArtifactRoot "$(ob_outputDirectory)\SwitcherBaselining"
      env:
        SWITCHER_LAF_TOKEN: $(CompositionSwitcherLafToken)

    - task: PublishPipelineArtifact@1
      condition: and(always(), eq(variables['SwitcherArtifactsSanitized'], 'true'))
      displayName: Publish switcher output for baselining
      inputs:
        targetPath: $(ob_outputDirectory)\SwitcherBaselining
        artifact: 'switcher_x86chk'

  - template: WinUI-RunSwitcherFullSuite-Job.yml
    parameters:
      jobName: RunSwitcherFullSuite_UAP_x86chk
      displayName: 'Probe full master-backed UAP suite under SwitcherMode'
      hostingMode: UAP
      logFileName: fullsuite-switcher-probe-uap.log
      artifactName: switcher_fullsuite_uap_x86chk
      preflightTestBinaryPattern: 'Test\Microsoft.UI.Xaml.Tests.External.*.dll'
      certificationMarker: 'SwitcherMode: native packaged UAP test process selected and certified System composition.'
      additionalCertificationMarker: 'SwitcherMode: managed packaged UAP test process selected and certified System composition.'
      preflightTestSelector: 'SwitcherTests*VerifyLiftedSystemCompositionPath'
      preflightLogFileName: switcher-preflight-uap-native.log
      additionalPreflightTestSelector: 'SwitcherTests*VerifyManagedPackagedHostSystemCompositionPath'
      additionalPreflightLogFileName: switcher-preflight-uap-managed.log

  - template: WinUI-RunSwitcherFullSuite-Job.yml
    parameters:
      jobName: RunSwitcherFullSuite_WPF_x86chk
      displayName: 'Probe full master-backed WPF suite under SwitcherMode'
      hostingMode: WPF
      logFileName: fullsuite-switcher-probe-wpf.log
      artifactName: switcher_fullsuite_wpf_x86chk
      preflightTestBinaryPattern: 'Test\Microsoft.UI.Xaml.Tests.*.dll'
      certificationMarker: 'SwitcherMode: Private.Infrastructure.Hosting.WPF.HostFactory selected and certified System composition.'
      preflightTestSelector: 'WPFTests*VerifyPLMHandlerNoException'
      preflightLogFileName: switcher-preflight-wpf.log
